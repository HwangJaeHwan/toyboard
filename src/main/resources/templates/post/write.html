<!DOCTYPE html>
<html lang="ko" th:replace="~{layout/base :: layout(~{::content})}" xmlns:th="http://www.thymeleaf.org">
<div th:fragment="content">
    <section class="page-panel form-shell">
        <h1 class="page-title mb-4">게시글 작성</h1>
        <form th:object="${post}" method="post">
            <div class="mb-3">
                <label class="form-label">게시판</label>
                <select th:field="*{postType}" class="form-select">
                    <option th:each="postCode : ${postCodes}" th:value="${postCode.postType}" th:text="${postCode.displayName}"></option>
                </select>
                <p th:errors="*{postType}" class="field-error">게시판 오류</p>
            </div>
            <div class="mb-3">
                <label class="form-label">제목</label>
                <input type="text" class="form-control" th:field="*{title}" placeholder="제목을 입력하세요">
                <p th:errors="*{title}" class="field-error">제목 오류</p>
            </div>
            <div class="mb-3">
                <label class="form-label">내용</label>
                <textarea id="summernote" th:field="*{content}"></textarea>
                <p th:errors="*{content}" class="field-error">내용 오류</p>
            </div>
            <div class="d-flex justify-content-end gap-2">
                <a class="btn btn-outline-secondary" th:href="@{/posts}">취소</a>
                <button class="btn btn-primary" type="submit">등록</button>
            </div>
        </form>
    </section>

    <script>
        $(document).ready(function() {
            $('#summernote').summernote({
                width: '100%',
                height: 420,
                lang: 'ko-KR',
                callbacks: {
                    onImageUpload: function(files) {
                        uploadSummernoteImageFile(files[0], this);
                    }
                },
                placeholder: '내용을 입력하세요'
            });
        });

        function uploadSummernoteImageFile(file, editor) {
            const data = new FormData();
            data.append('file', file);
            $.ajax({
                data: data,
                type: 'POST',
                url: '/posts/image',
                contentType: false,
                processData: false,
                success: function(url) {
                    $(editor).summernote('insertImage', url);
                }
            });
        }
    </script>
</div>
</html>
