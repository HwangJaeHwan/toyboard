<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::content})}">
<div th:fragment="content">
    <section class="page-panel">
        <div class="d-flex justify-content-between align-items-start gap-3 mb-3">
            <div>
                <h1 class="page-title" th:text="${post.title}">제목</h1>
                <div class="meta-line mt-2">
                    <span th:text="${post.nickname}">작성자</span>
                    <span th:text="${#temporals.format(post.createTime, 'yyyy/MM/dd HH:mm')}">작성일</span>
                    <span>조회 <strong th:text="${post.viewCount}">0</strong></span>
                </div>
            </div>
            <div class="d-flex gap-2" th:if="${session.loginUser != null and (session.loginUser.nickname == post.nickname or session.loginUser.userType.name() == 'ADMIN')}">
                <a th:href="@{/posts/{id}/update(id=${post.id})}" class="btn btn-outline-primary btn-sm">수정</a>
                <a th:href="@{/posts/{id}/delete(id=${post.id})}" class="btn btn-outline-danger btn-sm">삭제</a>
            </div>
            <div th:unless="${session.loginUser != null and (session.loginUser.nickname == post.nickname or session.loginUser.userType.name() == 'ADMIN')}">
                <button class="btn btn-outline-danger btn-sm" th:onclick="|postReport(${post.id})|">신고</button>
            </div>
        </div>

        <article class="post-body" th:utext="${post.content}"></article>

        <div class="text-center mt-4">
            <button class="vote-button" th:onclick="|clickRecommend(${post.id})|">
                <img src="../../static/icon/icons8-volunteering-64.png" th:src="@{/icon/icons8-volunteering-64.png}" alt="추천">
            </button>
            <div class="fw-bold mt-2"><span id="recommendedNumber" th:text="${post.recommendedNumber}">0</span> 추천</div>
        </div>
    </section>

    <section class="page-panel">
        <div class="toolbar">
            <div>
                <h2 class="section-title mb-0" id="commentNums">댓글 [[${commentNums}]]개</h2>
                <p class="page-subtitle">의견을 남기고 대댓글로 이어갈 수 있습니다.</p>
            </div>
        </div>

        <div id="comments">
            <div class="comment-card p-3 mb-3" th:each="commentDTO : ${comments}" th:id="|comment${commentDTO.id}|">
                <div class="d-flex justify-content-between gap-3">
                    <div>
                        <strong th:text="${commentDTO.nickname}">작성자</strong>
                        <p class="mb-2 mt-2" th:if="${commentDTO.report >= 10}">신고 누적으로 숨겨진 댓글입니다.</p>
                        <p class="mb-2 mt-2" th:unless="${commentDTO.report >= 10}" th:text="${commentDTO.content}">댓글</p>
                    </div>
                    <div class="dropdown">
                        <button class="btn btn-sm btn-light" type="button" data-bs-toggle="dropdown" aria-expanded="false">...</button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li th:if="${session.loginUser != null and (session.loginUser.id == commentDTO.userId or userType.name() == 'ADMIN')}">
                                <a class="dropdown-item text-danger" href="#" th:onclick="|clickDelete(${commentDTO.id})|">삭제</a>
                            </li>
                            <li><a class="dropdown-item" href="#" th:onclick="|clickReport(${commentDTO.id})|">신고</a></li>
                        </ul>
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-2">
                    <button class="btn btn-sm btn-outline-success" th:onclick="|commentUp(${commentDTO.id})|">추천 <span th:id="|up${commentDTO.id}|" th:text="${commentDTO.up}">0</span></button>
                    <button class="btn btn-sm btn-outline-danger" th:onclick="|commentDown(${commentDTO.id})|">비추천 <span th:id="|down${commentDTO.id}|" th:text="${commentDTO.down}">0</span></button>
                    <button class="btn btn-sm btn-outline-primary" th:onclick="|toggleReplyInput(${commentDTO.id})|">답글</button>
                </div>

                <button class="btn btn-sm btn-link px-0" th:if="${commentDTO.reply > 0}" th:id="|toggleReplyBtn${commentDTO.id}|" th:onclick="|toggleReplies(${commentDTO.id})|">
                    답글 [[${commentDTO.reply}]]개
                </button>

                <div class="mt-3" th:id="|replyInputBox${commentDTO.id}|" style="display: none;">
                    <div class="d-flex gap-2">
                        <textarea class="form-control" rows="2" th:id="|replyInput${commentDTO.id}|" placeholder="답글을 입력하세요"></textarea>
                        <button class="btn btn-primary" th:onclick="|addReplyComment(${commentDTO.id})|">등록</button>
                    </div>
                </div>
                <div class="mt-2" th:id="|replies${commentDTO.id}|" style="display: none;"></div>
            </div>
        </div>

        <div class="mt-4">
            <label class="form-label" for="newComment">댓글 작성</label>
            <div class="d-flex gap-2">
                <textarea id="newComment" class="form-control" rows="3" placeholder="댓글을 입력하세요"></textarea>
                <button class="btn btn-primary" th:onclick="|addComment(${post.id})|">등록</button>
            </div>
        </div>
    </section>

    <script th:inline="javascript">
        const postId = [[${post.id}]];
        const loginUserId = [[${session.loginUser != null ? session.loginUser.id : null}]];
        const loginUserType = [[${session.loginUser != null ? session.loginUser.userType.name() : ''}]];

        function escapeHtml(value) {
            return String(value ?? '')
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
        }

        function canManageComment(comment) {
            return loginUserId === comment.userId || loginUserType === 'ADMIN';
        }

        function renderComment(comment) {
            const body = comment.report >= 10 ? '신고 누적으로 숨겨진 댓글입니다.' : escapeHtml(comment.content);
            const deleteItem = canManageComment(comment)
                ? `<li><a class="dropdown-item text-danger" href="#" onclick="clickDelete(${comment.id})">삭제</a></li>`
                : '';
            const replyButton = comment.reply > 0
                ? `<button class="btn btn-sm btn-link px-0" id="toggleReplyBtn${comment.id}" onclick="toggleReplies(${comment.id})">답글 ${comment.reply}개</button>`
                : '';

            return `
                <div class="comment-card p-3 mb-3" id="comment${comment.id}">
                    <div class="d-flex justify-content-between gap-3">
                        <div><strong>${escapeHtml(comment.nickname)}</strong><p class="mb-2 mt-2">${body}</p></div>
                        <div class="dropdown">
                            <button class="btn btn-sm btn-light" type="button" data-bs-toggle="dropdown">...</button>
                            <ul class="dropdown-menu dropdown-menu-end">${deleteItem}<li><a class="dropdown-item" href="#" onclick="clickReport(${comment.id})">신고</a></li></ul>
                        </div>
                    </div>
                    <div class="d-flex justify-content-end gap-2 mt-2">
                        <button class="btn btn-sm btn-outline-success" onclick="commentUp(${comment.id})">추천 <span id="up${comment.id}">${comment.up}</span></button>
                        <button class="btn btn-sm btn-outline-danger" onclick="commentDown(${comment.id})">비추천 <span id="down${comment.id}">${comment.down}</span></button>
                        <button class="btn btn-sm btn-outline-primary" onclick="toggleReplyInput(${comment.id})">답글</button>
                    </div>
                    ${replyButton}
                    <div class="mt-3" id="replyInputBox${comment.id}" style="display: none;">
                        <div class="d-flex gap-2">
                            <textarea class="form-control" rows="2" id="replyInput${comment.id}" placeholder="답글을 입력하세요"></textarea>
                            <button class="btn btn-primary" onclick="addReplyComment(${comment.id})">등록</button>
                        </div>
                    </div>
                    <div class="mt-2" id="replies${comment.id}" style="display: none;"></div>
                </div>`;
        }

        function renderReply(reply) {
            const body = reply.report >= 10 ? '신고 누적으로 숨겨진 댓글입니다.' : escapeHtml(reply.content);
            const deleteItem = canManageComment(reply)
                ? `<li><a class="dropdown-item text-danger" href="#" onclick="clickDelete(${reply.id})">삭제</a></li>`
                : '';
            return `
                <div class="comment-card reply-card p-3 mb-2" id="reply${reply.id}">
                    <div class="d-flex justify-content-between gap-3">
                        <div><strong>${escapeHtml(reply.nickname)}</strong><p class="mb-2 mt-2">${body}</p></div>
                        <div class="dropdown">
                            <button class="btn btn-sm btn-light" type="button" data-bs-toggle="dropdown">...</button>
                            <ul class="dropdown-menu dropdown-menu-end">${deleteItem}<li><a class="dropdown-item" href="#" onclick="clickReport(${reply.id})">신고</a></li></ul>
                        </div>
                    </div>
                    <div class="d-flex justify-content-end gap-2">
                        <button class="btn btn-sm btn-outline-success" onclick="commentUp(${reply.id})">추천 <span id="up${reply.id}">${reply.up}</span></button>
                        <button class="btn btn-sm btn-outline-danger" onclick="commentDown(${reply.id})">비추천 <span id="down${reply.id}">${reply.down}</span></button>
                    </div>
                </div>`;
        }

        function showComments(id) {
            $.ajax({
                url: '/comments/' + id,
                type: 'GET',
                success: function(response) {
                    const comments = response.data || [];
                    $('#comments').html(comments.map(renderComment).join(''));
                    $('#commentNums').text('댓글 ' + comments.length + '개');
                },
                error: function() { alert('댓글을 불러오지 못했습니다.'); }
            });
        }

        function clickRecommend(id) {
            $.ajax({
                url: '/posts/' + id + '/recommends',
                type: 'GET',
                success: function(count) { $('#recommendedNumber').text(count); }
            });
        }

        function clickReport(id) {
            if (!confirm('댓글을 신고하시겠습니까?')) return;
            $.ajax({
                url: '/comments/' + id + '/reports',
                type: 'PATCH',
                success: function(response) { alert(response.message); }
            });
        }

        function postReport(id) {
            if (!confirm('게시글을 신고하시겠습니까?')) return;
            $.ajax({
                url: '/posts/' + id + '/reports',
                type: 'PATCH',
                success: function(response) { alert(response.message); }
            });
        }

        function addComment(id) {
            const content = $('#newComment').val();
            if (!content.trim()) {
                alert('댓글을 입력하세요.');
                return;
            }
            $.ajax({
                url: '/comments/' + id,
                type: 'POST',
                data: JSON.stringify({ content: content }),
                contentType: 'application/json; charset=utf-8',
                success: function() {
                    $('#newComment').val('');
                    showComments(id);
                }
            });
        }

        function clickDelete(id) {
            if (!confirm('댓글을 삭제하시겠습니까?')) return;
            $.ajax({
                url: '/comments/' + id,
                type: 'DELETE',
                success: function(response) {
                    alert(response.message);
                    showComments(postId);
                }
            });
        }

        function commentUp(id) {
            $.ajax({
                url: '/comments/' + id + '/ups',
                type: 'GET',
                success: function(response) { $('#up' + id).text(response.data.count); }
            });
        }

        function commentDown(id) {
            $.ajax({
                url: '/comments/' + id + '/downs',
                type: 'GET',
                success: function(response) { $('#down' + id).text(response.data.count); }
            });
        }

        function toggleReplyInput(commentId) {
            $('#replyInputBox' + commentId).toggle();
        }

        function loadReplies(commentId) {
            $.ajax({
                url: '/comments/' + commentId + '/replies',
                type: 'GET',
                success: function(response) {
                    const replies = response.data || [];
                    $('#replies' + commentId).html(replies.map(renderReply).join('')).show();
                    $('#toggleReplyBtn' + commentId).text('답글 닫기');
                },
                error: function() { alert('답글을 불러오지 못했습니다.'); }
            });
        }

        function toggleReplies(commentId) {
            const replies = $('#replies' + commentId);
            if (replies.is(':visible')) {
                replies.hide();
                $('#toggleReplyBtn' + commentId).text('답글 보기');
            } else {
                loadReplies(commentId);
            }
        }

        function addReplyComment(parentId) {
            const content = $('#replyInput' + parentId).val();
            if (!content.trim()) {
                alert('답글을 입력하세요.');
                return;
            }
            $.ajax({
                url: '/comments/' + parentId + '/replies',
                type: 'POST',
                data: JSON.stringify({ content: content }),
                contentType: 'application/json; charset=utf-8',
                success: function() {
                    $('#replyInput' + parentId).val('');
                    loadReplies(parentId);
                }
            });
        }
    </script>
</div>
</html>
