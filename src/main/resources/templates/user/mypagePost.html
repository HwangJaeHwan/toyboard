<!DOCTYPE html>
<html lang="ko" th:replace="~{layout/base :: layout(~{::content})}" xmlns:th="http://www.thymeleaf.org">
<div th:fragment="content">
    <section class="page-panel">
        <div class="toolbar">
            <div>
                <h1 class="page-title" th:text="${myPage.nickname}">닉네임</h1>
                <p class="page-subtitle">작성 게시글 <strong th:text="${myPage.postNum}">0</strong>개</p>
            </div>
            <a class="btn btn-sm btn-light" th:href="@{/mypage/{id}(id=${myPage.userId})}">전체 활동 보기</a>
        </div>
    </section>

    <section class="page-panel table-card">
        <h2 class="section-title">작성글 로그</h2>
        <table class="table table-hover align-middle">
            <tbody>
            <tr th:each="log : ${myPage.logs.dtoList}">
                <td>
                    <span th:text="${log.message}">메시지</span>
                    <div class="text-muted small" th:text="${#temporals.format(log.createTime, 'yyyy/MM/dd HH:mm')}">날짜</div>
                    <a class="post-title-link" th:href="@{/posts/{id}(id=${log.postId})}" th:text="${log.postTitle}">게시글</a>
                </td>
            </tr>
            </tbody>
        </table>
        <div class="empty-state" th:if="${#lists.isEmpty(myPage.logs.dtoList)}">작성글 로그가 없습니다.</div>
    </section>

    <nav class="mt-4" th:if="${myPage.logs.pageInfo != null}">
        <ul class="pagination">
            <li th:if="${myPage.logs.pageInfo.prev}"><a th:href="@{/mypage/{id}/posts(id=${myPage.userId},page=${myPage.logs.pageInfo.start - 1})}">&lt;</a></li>
            <li th:class="${myPage.logs.pageInfo.now == num ? 'active' : ''}" th:each="num : ${myPage.logs.pageInfo.pageList}">
                <a th:href="@{/mypage/{id}/posts(id=${myPage.userId},page=${num})}" th:text="${num}">1</a>
            </li>
            <li th:if="${myPage.logs.pageInfo.next}"><a th:href="@{/mypage/{id}/posts(id=${myPage.userId},page=${myPage.logs.pageInfo.end + 1})}">&gt;</a></li>
        </ul>
    </nav>
</div>
</html>
