<!DOCTYPE html>
<html lang="ko" th:replace="~{layout/base :: layout(~{::content})}" xmlns:th="http://www.thymeleaf.org">
<div th:fragment="content">
    <section class="page-panel auth-shell">
        <h1 class="page-title mb-4">회원가입</h1>
        <form method="post" th:object="${user}">
            <div class="mb-3">
                <label class="form-label">아이디</label>
                <input class="form-control" type="text" th:field="*{loginId}" placeholder="5~20자 아이디">
                <p th:errors="*{loginId}" class="field-error">아이디 오류</p>
            </div>
            <div class="mb-3">
                <label class="form-label">비밀번호</label>
                <input class="form-control" type="password" th:field="*{password}" placeholder="비밀번호">
                <p th:errors="*{password}" class="field-error">비밀번호 오류</p>
            </div>
            <div class="mb-3">
                <label class="form-label">비밀번호 확인</label>
                <input class="form-control" type="password" th:field="*{passwordCheck}" placeholder="비밀번호 확인">
                <p th:errors="*{passwordCheck}" class="field-error">비밀번호 확인 오류</p>
            </div>
            <div class="mb-3">
                <label class="form-label">닉네임</label>
                <input class="form-control" type="text" th:field="*{nickname}" placeholder="닉네임">
                <p th:errors="*{nickname}" class="field-error">닉네임 오류</p>
            </div>
            <div class="mb-4">
                <label class="form-label">이메일</label>
                <input class="form-control" type="email" th:field="*{email}" placeholder="email@example.com">
                <p th:errors="*{email}" class="field-error">이메일 오류</p>
            </div>
            <button class="btn btn-primary w-100" type="submit">가입하기</button>
        </form>
    </section>
</div>
</html>
