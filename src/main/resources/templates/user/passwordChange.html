<!DOCTYPE html>
<html lang="ko" th:replace="~{layout/base :: layout(~{::content})}" xmlns:th="http://www.thymeleaf.org">
<div th:fragment="content">
    <section class="page-panel auth-shell">
        <h1 class="page-title mb-4">비밀번호 변경</h1>
        <form method="post" th:object="${password}">
            <div class="mb-3">
                <label class="form-label">현재 비밀번호</label>
                <input class="form-control" type="password" th:field="*{nowPassword}" placeholder="현재 비밀번호">
                <p th:errors="*{nowPassword}" class="field-error">현재 비밀번호 오류</p>
            </div>
            <div class="mb-3">
                <label class="form-label">새 비밀번호</label>
                <input class="form-control" type="password" th:field="*{newPassword}" placeholder="새 비밀번호">
                <p th:errors="*{newPassword}" class="field-error">새 비밀번호 오류</p>
            </div>
            <div class="mb-4">
                <label class="form-label">새 비밀번호 확인</label>
                <input class="form-control" type="password" th:field="*{newPasswordCheck}" placeholder="새 비밀번호 확인">
                <p th:errors="*{newPasswordCheck}" class="field-error">새 비밀번호 확인 오류</p>
            </div>
            <button class="btn btn-primary w-100" type="submit">변경하기</button>
        </form>
    </section>
</div>
</html>
