<!DOCTYPE html>
<html lang="ko" th:replace="~{layout/base :: layout(~{::content})}" xmlns:th="http://www.thymeleaf.org">
<div th:fragment="content">
    <section class="page-panel auth-shell">
        <h1 class="page-title mb-4">로그인</h1>
        <form method="post" th:object="${user}">
            <div class="mb-3">
                <label class="form-label">아이디</label>
                <input class="form-control" type="text" th:field="*{loginId}" placeholder="아이디를 입력하세요">
            </div>
            <div class="mb-3">
                <label class="form-label">비밀번호</label>
                <input class="form-control" type="password" th:field="*{password}" placeholder="비밀번호를 입력하세요">
            </div>
            <div th:if="${#fields.hasErrors()}" class="mb-3">
                <p th:each="err : ${#fields.errors()}" class="field-error" th:text="${err}">오류</p>
            </div>
            <button class="btn btn-primary w-100" type="submit">로그인</button>
        </form>
    </section>
</div>
</html>
