<!DOCTYPE html>
<html lang="ko" th:fragment="layout(content)" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Toyboard</title>
    <link href="../../static/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link href="../../static/css/style.css" th:href="@{/css/style.css}" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/summernote/summernote-lite.css}">
    <script th:src="@{/jquery/jquery.min.js}"></script>
    <script th:src="@{/summernote/summernote-lite.js}"></script>
    <script th:src="@{/summernote/summernote-ko-KR.js}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<header class="app-header">
    <nav class="app-navbar">
        <div class="container app-nav-container">
            <div class="app-nav-left">
                <a class="navbar-brand fw-bold" th:href="@{/}">Toyboard</a>
            </div>
            <ul class="app-nav-menu">
                <li><a class="nav-link" th:href="@{/posts(postType='NOTICE')}">공지사항</a></li>
                <li><a class="nav-link" th:href="@{/posts(postType='FREE')}">자유게시판</a></li>
                <li><a class="nav-link" th:href="@{/posts(postType='INFO')}">정보게시판</a></li>
                <li><a class="nav-link" th:href="@{/posts(postType='QNA')}">Q&amp;A</a></li>
            </ul>
            <div class="app-nav-actions" th:if="${session.loginUser == null}">
                <a class="btn btn-outline-secondary btn-sm" th:href="@{/register}">회원가입</a>
                <a class="btn btn-primary btn-sm" th:href="@{/login}">로그인</a>
            </div>
            <div class="app-nav-actions" th:if="${session.loginUser != null}">
                <a class="user-chip" th:href="@{/mypage}" th:text="${session.loginUser.nickname}">사용자</a>
                <a class="btn btn-outline-secondary btn-sm" th:href="@{/logout}">로그아웃</a>
            </div>
        </div>
    </nav>
</header>

<main class="container app-main">
    <div th:replace="${content}">
        <span>content</span>
    </div>
</main>
</body>
</html>
