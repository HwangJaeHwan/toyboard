<!DOCTYPE html>
<html lang="ko" th:replace="~{layout/base :: layout(~{::content})}" xmlns:th="http://www.thymeleaf.org">
<div th:fragment="content">
    <section class="page-panel">
        <div class="toolbar">
            <div>
                <h1 class="page-title">회원 관리</h1>
                <p class="page-subtitle">회원 아이디와 닉네임으로 검색할 수 있습니다.</p>
            </div>
            <form class="search-form" method="get" th:action="@{/auth/users}">
                <select class="form-select form-select-sm" name="type" style="width: 140px;">
                    <option value="LOGIN_ID" th:selected="${param.type != null and param.type[0] == 'LOGIN_ID'}">아이디</option>
                    <option value="NICKNAME" th:selected="${param.type != null and param.type[0] == 'NICKNAME'}">닉네임</option>
                </select>
                <input class="form-control form-control-sm" type="text" name="content" th:value="${param.content != null ? param.content[0] : ''}" placeholder="검색어" style="width: 220px;">
                <button class="btn btn-outline-primary btn-sm" type="submit">검색</button>
            </form>
        </div>
    </section>

    <section class="page-panel table-card">
        <table class="table table-hover align-middle">
            <thead>
            <tr>
                <th>ID</th>
                <th>로그인 ID</th>
                <th>닉네임</th>
                <th>이메일</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${data.dtoList}">
                <td th:text="${user.id}">1</td>
                <td><a class="post-title-link" th:href="@{/mypage/{id}(id=${user.id})}" th:text="${user.loginId}">loginId</a></td>
                <td th:text="${user.nickname}">nickname</td>
                <td th:text="${user.email}">email</td>
            </tr>
            </tbody>
        </table>
        <div class="empty-state" th:if="${#lists.isEmpty(data.dtoList)}">회원이 없습니다.</div>
    </section>

    <nav class="mt-4" th:if="${data.pageInfo != null}">
        <ul class="pagination">
            <li th:if="${data.pageInfo.prev}"><a th:href="@{/auth/users(page=${data.pageInfo.start - 1},type=${param.type != null ? param.type[0] : null},content=${param.content != null ? param.content[0] : null})}">&lt;</a></li>
            <li th:class="${data.pageInfo.now == num ? 'active' : ''}" th:each="num : ${data.pageInfo.pageList}">
                <a th:href="@{/auth/users(page=${num},type=${param.type != null ? param.type[0] : null},content=${param.content != null ? param.content[0] : null})}" th:text="${num}">1</a>
            </li>
            <li th:if="${data.pageInfo.next}"><a th:href="@{/auth/users(page=${data.pageInfo.end + 1},type=${param.type != null ? param.type[0] : null},content=${param.content != null ? param.content[0] : null})}">&gt;</a></li>
        </ul>
    </nav>
</div>
</html>
